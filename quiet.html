<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#24213f">
  <title>熊的安静角落</title>
  <style>
    :root{--ink:#23213a;--paper:#f5f1e8;--violet:#6b5fac;--line:rgba(35,33,58,.14);--muted:#747184}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 86% 5%,rgba(126,164,197,.22),transparent 25rem),radial-gradient(circle at 3% 45%,rgba(231,202,133,.18),transparent 23rem),var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",Georgia,serif;line-height:1.9}
    .shell{width:min(950px,calc(100% - 36px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:26px 0}.back{padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:inherit;background:#fff8;text-decoration:none;font:600 13px/1.2 ui-rounded,"PingFang SC",sans-serif}.mark{font:700 14px/1 ui-rounded,"PingFang SC",sans-serif;letter-spacing:.08em}.hero{padding:74px 0 86px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--violet);font:700 12px/1.2 ui-rounded,"PingFang SC",sans-serif;letter-spacing:.16em;text-transform:uppercase}.hero h1{max-width:700px;margin:17px 0 18px;font-size:clamp(50px,8vw,88px);line-height:1.02;letter-spacing:-.06em}.hero p{max-width:580px;margin:0;color:var(--muted);font-size:18px}
    .essays{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:48px 0 90px}.essay{min-height:330px;padding:34px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.66);box-shadow:0 20px 55px rgba(48,42,79,.07)}.essay:nth-child(2){background:rgba(226,220,241,.68)}.essay:nth-child(3){background:rgba(214,229,239,.72)}.essay:nth-child(4){background:rgba(244,226,188,.62)}.number{color:var(--violet);font:700 11px/1.2 ui-rounded,"PingFang SC",sans-serif;letter-spacing:.15em}.essay h2{margin:58px 0 16px;font-size:27px;line-height:1.25}.essay p{margin:0;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:24px;padding:24px 0 48px;border-top:1px solid var(--line);color:var(--muted);font:500 12px/1.7 ui-rounded,"PingFang SC",sans-serif}
    @media(max-width:700px){.hero{padding:50px 0 62px}.essays{grid-template-columns:1fr}.essay{min-height:270px}footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="mark">✦ 熊的安静角落</div><a class="back" href="index.html">回到外面</a></header>
    <main>
      <section class="hero"><div class="eyebrow">Private notes · 请轻声阅读</div><h1>一些没有放在<br>明面上的文字</h1><p id="archive-intro">正在辨认暗号……</p></section>
      <section class="essays" id="essay-list" aria-label="短文列表"></section>
    </main>
    <footer><span>© 2026 银河系狗熊大使</span><span>访问资格只在当前浏览器标签页内保留。</span></footer>
  </div>
  <script>
    const encryptedArchive = {
      salt: 'OHIDrO220YgLLxwlS7TPNw==',
      iv: 'NZNyroXKAld7+OFt',
      data: 'pE1KuKA3nYRrNO7RM8KLEmUCv6lPbtyQs/CZQ6AoTlufUHBbfDRphPyKUbLRKHSunLagGS/9xk5XtwCSA2rhntcNjqkF5OCzGVcmHZpQQywNaXuRekya8Ib7yiwD6KY9bp8u8B0iuIK/C0gOgpdsT/EjJ1HVUZnd4FAL65HRmDu2WKls5dRu2ZKXh7ALLwZrrr825/ZoYZfEE8/RBCn7dcG/SatT15oyKh9Yf0sWrvn1GfUw0nfA9q+JAJ25J1eVo/+Y+TWHjpMVyEpRG1pv+teyBCqWL5+1cYu662xT39fBPe4EIBlsdz2ANHM2qhlnEUaVnpzAG69vOrJxrEKWMR6kR4jLA6NV5tKN8x630nSymjIr1UOZ9ccuC7Nx7yj/spyWI2ZvxL5xcxq+jpvkdlX+Oqp5Rxcv5wlOOAo3KweQ0aBX9RNumjgG4RtAldh7merzbWQhai8cjyqWMSEwYMCvpidjtsXPMIgOdc1NQSDRyD8MaMm3z5SgItCYoVKckVtS/UwkkGanx+ciEEBKsEODTLX3KJehoXTXQ8MvzddyJYAyRyzc51wwQMbfGRkl8x7aQ3r4oFydLp5rDcNXTz/B0SHXnuaInKmqOP8HhHw4pM/K5aKVeyFrs0JHjRZVTkaFdHotS0mizpoFoXztMXeYZ1hwlStUPEEikmR59wPuoyq9P8qI0op38JtCedGU1YB8mOnuLA8Ze6e45ZS4R00YXnbfoAqGdqxtDVB550XUq6Bml7Gi3pS85Cng3j8J86yDGHGq9NrZEYPtw6bwIhzKp+EqsamYUWSJgJvK7wxgiMVWXi3zhGcPmcDVxLMZYQKx4UzPXcn4dxFzLgYk1RlrD1k='
    };
    const fromBase64 = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    async function openArchive() {
      const password = sessionStorage.getItem('bearArchivePassword');
      if (!password) return window.location.replace('index.html');
      try {
        const encoder = new TextEncoder();
        const baseKey = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromBase64(encryptedArchive.salt), iterations: 250000, hash: 'SHA-256' }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(encryptedArchive.iv) }, key, fromBase64(encryptedArchive.data));
        const archive = JSON.parse(new TextDecoder().decode(plain));
        document.querySelector('#archive-intro').textContent = archive.intro;
        const list = document.querySelector('#essay-list');
        archive.essays.forEach(([title, body], index) => {
          const article = document.createElement('article');
          article.className = 'essay';
          const number = document.createElement('div');
          number.className = 'number';
          number.textContent = `TEXT · ${String(index + 1).padStart(2, '0')}`;
          const heading = document.createElement('h2');
          heading.textContent = title;
          const paragraph = document.createElement('p');
          paragraph.textContent = body;
          article.append(number, heading, paragraph);
          list.append(article);
        });
        sessionStorage.removeItem('bearArchivePassword');
      } catch {
        sessionStorage.removeItem('bearArchivePassword');
        sessionStorage.setItem('bearArchiveError', '1');
        window.location.replace('index.html');
      }
    }
    openArchive();
  </script>
</body>
</html>
